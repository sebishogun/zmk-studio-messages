syntax = "proto3";

package zmk.behaviors;

message Request {
    oneof request_type {
        bool list_all_behaviors = 1;
        GetBehaviorDetailsRequest get_behavior_details = 2;
        // AuroraKey live-USB mutation extension. Lets the editor change
        // hold-tap timing, mod-tap-style behavior bindings, and the
        // bindings of slot-pool macros without rebuild + reflash. Each
        // request is idempotent and applies to RAM only — call
        // zmk.keymap.save_changes to persist to flash. ID range
        // 100..199 is reserved for AuroraKey-specific extensions so
        // future upstream additions don't collide.
        GetHoldTapParamsRequest get_holdtap_params = 100;
        SetHoldTapParamsRequest set_holdtap_params = 101;
        ListMacroSlotsRequest list_macro_slots = 102;
        SetMacroSlotRequest set_macro_slot = 103;
    }
}

message GetBehaviorDetailsRequest {
    uint32 behavior_id = 1;
}

message Response {
    oneof response_type {
        ListAllBehaviorsResponse list_all_behaviors = 1;
        GetBehaviorDetailsResponse get_behavior_details = 2;

        GetHoldTapParamsResponse get_holdtap_params = 100;
        SetHoldTapParamsResponse set_holdtap_params = 101;
        ListMacroSlotsResponse list_macro_slots = 102;
        SetMacroSlotResponse set_macro_slot = 103;
    }
}

// ---- Hold-tap params -------------------------------------------------
//
// Targets a single behavior_id from list_all_behaviors. Only behaviors
// whose `compatible` is `zmk,behavior-hold-tap` accept these requests;
// any other behavior_id resolves to HOLDTAP_ERR_NOT_HOLDTAP.

message GetHoldTapParamsRequest {
    uint32 behavior_id = 1;
}

message GetHoldTapParamsResponse {
    oneof result {
        HoldTapParams ok = 1;
        HoldTapErrorCode err = 2;
    }
}

message SetHoldTapParamsRequest {
    uint32 behavior_id = 1;
    HoldTapParams params = 2;
}

message SetHoldTapParamsResponse {
    HoldTapErrorCode result = 1;
}

// HoldTapFlavor mirrors the DT enum in
// dts/bindings/behaviors/zmk,behavior-hold-tap.yaml. Wire encoding
// stays uint32 so the firmware can cast directly to the enum value
// after a range check.
enum HoldTapFlavor {
    HOLD_TAP_FLAVOR_TAP_PREFERRED = 0;
    HOLD_TAP_FLAVOR_HOLD_PREFERRED = 1;
    HOLD_TAP_FLAVOR_BALANCED = 2;
    HOLD_TAP_FLAVOR_TAP_UNLESS_INTERRUPTED = 3;
}

message HoldTapParams {
    HoldTapFlavor flavor = 1;
    // 50..2000 ms; 0 keeps the firmware-baked default.
    uint32 tapping_term_ms = 2;
    uint32 quick_tap_ms = 3;
    uint32 require_prior_idle_ms = 4;
    bool hold_trigger_on_release = 5;
    // Optional position gate — empty means "every position" (the same
    // semantics as omitting hold-trigger-key-positions in DT).
    repeated uint32 hold_trigger_key_positions = 6;
}

enum HoldTapErrorCode {
    HOLDTAP_ERR_OK = 0;
    HOLDTAP_ERR_GENERIC = 1;
    HOLDTAP_ERR_INVALID_BEHAVIOR_ID = 2;
    HOLDTAP_ERR_NOT_HOLDTAP = 3;
    HOLDTAP_ERR_INVALID_PARAMETERS = 4;
    HOLDTAP_ERR_BEHAVIOR_BUSY = 5;
}

// ---- Macro slot pool -------------------------------------------------
//
// At build time the firmware reserves N (default 8, Kconfig-tunable)
// "slot macros" with empty bindings. The editor pushes bindings into
// any slot at runtime, then references the slot by index from a
// keymap binding (`&slot_macro 0`, `&slot_macro 1`, …). This sidesteps
// the dtc requirement that bindings be const at build.

message ListMacroSlotsRequest {}

message ListMacroSlotsResponse {
    repeated MacroSlot slots = 1;
    // The fixed slot count compiled in. Editor hides slots beyond
    // this from the picker.
    uint32 total_slots = 2;
}

message MacroSlot {
    uint32 index = 1;
    // The display label is owned by the firmware — slot N gets the
    // name "slot_N". Editor can override locally for UI-only labels.
    string label = 2;
    // Empty when the slot has never been written.
    repeated MacroBinding bindings = 3;
    uint32 wait_ms = 4;
    uint32 tap_ms = 5;
}

message SetMacroSlotRequest {
    uint32 index = 1;
    repeated MacroBinding bindings = 2;
    // 0 means "use firmware default" — same convention the build-time
    // generator uses.
    uint32 wait_ms = 3;
    uint32 tap_ms = 4;
}

// MacroBinding represents one element of the slot's bindings list.
// It's a flat encoding of the inner behavior reference + parameters.
message MacroBinding {
    // The inner behavior id from list_all_behaviors. e.g. &kp's id.
    uint32 behavior_id = 1;
    // Parameters as the inner behavior expects them. For &kp this is
    // the keycode in param1; for &macro_press / _release it's the
    // wrapped behavior id; for &macro_wait_time it's the ms in param1.
    uint32 param1 = 2;
    uint32 param2 = 3;
}

message SetMacroSlotResponse {
    MacroSlotErrorCode result = 1;
}

enum MacroSlotErrorCode {
    MACRO_SLOT_ERR_OK = 0;
    MACRO_SLOT_ERR_GENERIC = 1;
    MACRO_SLOT_ERR_INVALID_INDEX = 2;
    MACRO_SLOT_ERR_TOO_MANY_BINDINGS = 3;
    MACRO_SLOT_ERR_INVALID_INNER_BEHAVIOR = 4;
}

message ListAllBehaviorsResponse {
    repeated uint32 behaviors = 1;
}

message GetBehaviorDetailsResponse {
    uint32 id = 1;
    string display_name = 2;
    repeated BehaviorBindingParametersSet metadata = 3;
}

message BehaviorBindingParametersSet {
    repeated BehaviorParameterValueDescription param1 = 1;
    repeated BehaviorParameterValueDescription param2 = 2;
}

message BehaviorParameterValueDescriptionRange {
    int32 min = 1;
    int32 max = 2;
}

message BehaviorParameterNil {}
message BehaviorParameterLayerId {}
message BehaviorParameterHidUsage {
	uint32 keyboard_max = 1;
	uint32 consumer_max = 2;
}

message BehaviorParameterValueDescription {
    string name = 1;

    oneof value_type {
        BehaviorParameterNil nil = 2;
        uint32 constant = 3;
        BehaviorParameterValueDescriptionRange range = 4;
        BehaviorParameterHidUsage hid_usage = 5;
        BehaviorParameterLayerId layer_id = 6;
    }
}
